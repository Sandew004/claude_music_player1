<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Glass Music">
<meta name="theme-color" content="#03040a"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png">
<title>Glass Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@property --h{syntax:'<number>';inherits:true;initial-value:210}
:root{--h:265;--c1:hsl(var(--h) 100% 62%);--c2:hsl(calc(var(--h) + 130) 100% 62%);--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
@media(hover:hover) and (pointer:fine){*{cursor:none!important}}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Segoe UI",system-ui,sans-serif;background:#03040a;color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:0}
input{font:inherit;color:inherit}
svg{width:22px;height:22px;flex:none;display:block;fill:currentColor}[hidden]{display:none!important}

/* living background: dark room, neon strips */
.bg{--c1:hsl(var(--h) 100% 62%);--c2:hsl(calc(var(--h) + 130) 100% 62%);transition:--h 1.2s ease;position:fixed;inset:0;overflow:hidden;z-index:0;background:radial-gradient(120% 80% at 50% -10%,#0d1020,#03040a 62%)}
.bg i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;will-change:transform;animation:drift 26s ease-in-out infinite alternate}
.bg i:nth-child(1){left:-25vmax;top:-30vmax;background:radial-gradient(closest-side,hsl(var(--h) 95% 55%/.34),transparent)}
.bg i:nth-child(2){right:-30vmax;top:5vh;background:radial-gradient(closest-side,hsl(calc(var(--h) + 130) 90% 55%/.28),transparent);animation-delay:-9s}
.bg i:nth-child(3){left:5vw;bottom:-45vmax;background:radial-gradient(closest-side,hsl(calc(var(--h) - 70) 90% 50%/.22),transparent);animation-delay:-17s}
@keyframes drift{to{transform:translate3d(10vmax,7vmax,0) scale(1.18)}}
.strip{position:absolute;display:block;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--c1) 18%,var(--c2) 82%,transparent);box-shadow:0 0 12px 1px var(--c1);animation:glow 5.5s ease-in-out infinite}
.strip::after{content:"";position:absolute;inset:-28px -4%;border-radius:50%;background:inherit;filter:blur(28px);opacity:.55}
.s1{top:15%;left:-8%;width:62%;transform:rotate(-13deg)}
.s2{bottom:19%;right:-10%;width:66%;transform:rotate(-13deg);animation-delay:-2.7s}
.s3,.s4{top:7%;bottom:7%;width:3px;height:auto;background:linear-gradient(180deg,transparent,var(--c2) 22%,var(--c1) 78%,transparent)}
.s3::after,.s4::after{inset:-4% -28px}
.s3{right:1.4%}.s4{left:1.4%;animation-delay:-1.6s}
@keyframes glow{50%{opacity:.5}}

/* liquid glass: dark, edge-lit by the cursor */
.glass{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.025) 55%,rgba(255,255,255,.06));backdrop-filter:blur(28px) saturate(190%) brightness(.92);-webkit-backdrop-filter:blur(28px) saturate(190%) brightness(.92);box-shadow:inset 0 1px 1px rgba(255,255,255,.4),inset 0 -1px 1px rgba(255,255,255,.08),inset 0 0 36px -14px var(--c2),0 30px 70px rgba(0,0,0,.6),0 0 60px -22px var(--c1)}
.spot{position:absolute;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;z-index:-1;background:radial-gradient(closest-side,rgba(255,255,255,.18),transparent);opacity:0;transition:opacity .4s;will-change:transform}.glass.lit .spot{opacity:1}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;background:conic-gradient(from calc(var(--ang,200deg) - 24deg),var(--c1),#fff 5%,transparent 28%,transparent 60%,var(--c2) 84%,var(--c1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.refract:not(.lite) #mini,.refract:not(.lite) #menu,.refract:not(.lite) #toast{backdrop-filter:blur(12px) saturate(190%) brightness(.92) url(#lg)}

/* layout */
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:minmax(330px,430px) 1fr;gap:20px;padding:20px;max-width:1360px;margin:auto}
.lib,.player{border-radius:38px;min-height:0;display:flex;flex-direction:column;animation:enter .9s var(--ease) both}
.player{animation-delay:.12s}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.97)}}
.lib{padding:24px 14px 12px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 10px}
h1{font-size:34px;font-weight:800;letter-spacing:-.025em;text-shadow:0 0 28px var(--c1)}
#count{padding:2px 10px 14px;opacity:.6;font-size:14px}
.search{display:flex;align-items:center;gap:8px;margin:0 6px 12px;padding:0 14px;height:42px;border-radius:14px;background:rgba(0,0,0,.25);box-shadow:inset 0 1px 2px rgba(0,0,0,.3);transition:box-shadow .3s,background .3s}
.search:focus-within{background:rgba(0,0,0,.38);box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.search svg{width:18px;height:18px;opacity:.6}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px;user-select:text}
.search input::placeholder{color:rgba(255,255,255,.45)}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin:0 6px;padding:3px;border-radius:14px;background:rgba(0,0,0,.25)}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:11px;background:rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 14px rgba(0,0,0,.2);transform:translateX(calc(var(--i,0)*100%));transition:transform .55s var(--spring)}
.seg button{position:relative;padding:8px 0;font-size:14px;font-weight:600;opacity:.65;transition:opacity .25s}
.seg button.on{opacity:1}
.list{flex:1;min-height:0;overflow-y:auto;margin-top:10px;padding:6px 4px 20px;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent 0,#000 10px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(transparent 0,#000 10px,#000 calc(100% - 22px),transparent)}
.list::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:13px;padding:9px 10px;border-radius:20px;content-visibility:auto;contain-intrinsic-size:auto 68px;transition:background .25s,transform .4s var(--spring)}
.row:hover{background:rgba(255,255,255,.1)}
.row:active{transform:scale(.97)}
.row.on{background:linear-gradient(100deg,rgba(255,255,255,.14),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 3px 0 0 var(--c1),0 0 26px -10px var(--c1)}
.in .row{animation:rowIn .6s var(--ease) var(--d) both}
@keyframes rowIn{from{opacity:0;transform:translateX(-16px)}}
.art{position:relative;overflow:hidden;flex:none;width:50px;height:50px;border-radius:12px;display:grid;place-items:center;color:rgba(255,255,255,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px rgba(0,0,0,.3)}
.art svg{width:22px;height:22px}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.t{flex:1;min-width:0}
.t b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t small{display:block;opacity:.58;font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:none;gap:3px;align-items:flex-end;height:16px}
.row.on .eq{display:flex}
.eq i{width:3px;height:4px;background:var(--c1);box-shadow:0 0 8px var(--c1);border-radius:2px;animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{to{height:16px}}
.fv{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;opacity:0;transition:opacity .2s,transform .35s var(--spring),color .2s}
.fv svg{width:18px;height:18px}
.row:hover .fv,.fv.on{opacity:1}
.fv.on{color:#ff5a7a}.fv:active{transform:scale(1.35)}
@media(hover:none){.fv{opacity:.7}}
.msg{padding:36px 20px;text-align:center;opacity:.65;font-size:15px}
.skl{height:64px;margin:6px 0;border-radius:18px;background:linear-gradient(100deg,rgba(255,255,255,.05) 30%,rgba(255,255,255,.16) 50%,rgba(255,255,255,.05) 70%);background-size:300% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-300% 0}}

/* player */
.player{align-items:center;justify-content:center;padding:28px 28px 24px;position:relative;overflow:hidden}
.back{display:none;position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:16px}
.popb{position:absolute;top:18px;right:18px}@media(hover:none){.popb{display:none}}
.wrap{position:relative;width:min(100%,44vh,420px);aspect-ratio:1;margin-bottom:26px}
.wrap::before{content:"";position:absolute;inset:8%;border-radius:30%;background:var(--g,#444) center/cover;filter:blur(38px);opacity:.7;transition:opacity .6s}
#big{position:absolute;inset:0;border-radius:28px;display:grid;place-items:center;overflow:hidden;background:#2a2d3a;color:rgba(255,255,255,.9);box-shadow:inset 0 2px 1px rgba(255,255,255,.55),inset 0 -2px 6px rgba(0,0,0,.2),0 30px 70px rgba(0,0,0,.45);transition:transform .8s var(--spring)}
#big::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.35),transparent 40%,transparent 60%,rgba(255,255,255,.12))}
#big svg{width:34%;height:34%}#big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fadeIn .7s both}@keyframes fadeIn{from{opacity:0}}
.paused #big{transform:scale(.85)}
.paused .wrap::before{opacity:.25}
#big.swap{animation:artIn .8s var(--spring)}
@keyframes artIn{from{transform:scale(.78) rotate(-5deg);opacity:.3}}
.meta{text-align:center;width:min(100%,440px)}
.meta h2{font-size:26px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p{opacity:.65;margin-top:4px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta.swap{animation:metaIn .6s var(--ease)}
@keyframes metaIn{from{opacity:0;transform:translateY(12px);filter:blur(4px)}}
.seekrow{display:flex;align-items:center;gap:12px;width:min(100%,440px);margin:26px 0 6px;font-size:12px;font-variant-numeric:tabular-nums}
.seekrow span{opacity:.65;min-width:40px}.seekrow span:last-child{text-align:right}
.rng{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:6px;border-radius:5px;background:linear-gradient(90deg,var(--c1),var(--c2) var(--p,0%),rgba(255,255,255,.16) var(--p,0%));box-shadow:0 0 14px -4px var(--c1);outline:0;transition:height .3s var(--spring)}
.rng:hover,.rng:active{height:10px}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:width .3s var(--spring),height .3s var(--spring)}
.rng:hover::-webkit-slider-thumb,.rng:active::-webkit-slider-thumb{width:16px;height:16px}
.rng::-moz-range-thumb{width:0;height:0;border:0}
.ib{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);transition:transform .45s var(--spring),background .25s,color .25s}
.ib:hover{background:rgba(255,255,255,.22);transform:scale(1.08)}
.ib:active{transform:scale(.88)}
.ib.sm{width:38px;height:38px}.ib.sm svg{width:19px;height:19px}
.ib.on{background:linear-gradient(135deg,var(--c1),var(--c2));color:#05060a;border-color:transparent;box-shadow:0 0 18px -2px var(--c1)}
.ib.tx{font-size:13px;font-weight:700}
.ctrl{display:flex;align-items:center;gap:clamp(8px,2.6vw,20px);margin:14px 0}
.ctrl .sk{width:54px;height:54px}
.ctrl .play{width:84px;height:84px;background:rgba(255,255,255,.93);color:#15171f;box-shadow:inset 0 2px 0 #fff,0 0 30px var(--c1),0 12px 56px -4px var(--c2)}
.play svg{width:38px;height:38px;animation:pop .45s var(--spring)}
@keyframes pop{from{transform:scale(.4) rotate(-25deg);opacity:0}}
.opts{display:flex;gap:12px;align-items:center;margin:4px 0 18px}
.volrow{display:flex;align-items:center;gap:12px;width:min(100%,300px)}

/* mini + mobile */
#mini{display:none}
@media(max-width:860px),(pointer:coarse) and (max-height:520px){
 .app{grid-template-columns:1fr;padding:calc(env(safe-area-inset-top) + 8px) 10px 0}
 .lib{height:100%;padding-bottom:96px}
 .player{position:fixed;inset:0;z-index:20;border-radius:0;background:rgba(10,12,22,.66);transform:translateY(104%);transition:transform .65s var(--ease);animation:none}
 body.pv .player{transform:none}
 .back{display:grid}
 #mini{display:flex;position:fixed;z-index:10;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);border-radius:32px;padding:9px 12px 9px 9px;align-items:center;gap:12px;transition:transform .55s var(--ease),opacity .3s}
 #mini.hide,body.pv #mini{transform:translateY(150%);opacity:0;pointer-events:none}
 .mt{flex:1;min-width:0}.mt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mt small{opacity:.6;font-size:12px}
 .wrap{width:min(76vw,40vh)}
 #toast{bottom:100px}
}
#menu{position:fixed;z-index:9990;min-width:200px;padding:6px;border-radius:20px;display:none;transform-origin:top left;animation:mpop .35s var(--ease)}
#menu button{display:block;width:100%;text-align:left;font-size:15px;padding:11px 14px;border-radius:14px}
#menu button:hover{background:rgba(255,255,255,.18)}
@keyframes mpop{from{transform:scale(.6);opacity:0}}
#toast{position:fixed;z-index:9995;left:50%;bottom:28px;padding:12px 22px;border-radius:999px;font-size:14px;opacity:0;transform:translate(-50%,30px) scale(.9);transition:.5s var(--spring);pointer-events:none;max-width:90vw;text-align:center;visibility:hidden}
#toast.on{opacity:1;transform:translate(-50%,0);visibility:visible}

/* glass-ball cursor */
#orb{position:fixed;z-index:9999;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,.25) 28%,rgba(255,255,255,.08) 60%);backdrop-filter:blur(3px) saturate(220%) brightness(1.25);-webkit-backdrop-filter:blur(3px) saturate(220%) brightness(1.25);border:1px solid rgba(255,255,255,.7);box-shadow:inset -2px -3px 5px rgba(255,255,255,.35),0 4px 14px rgba(0,0,0,.35),0 0 16px -2px var(--c1);transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),background .3s;will-change:transform}
#orb.hov{width:44px;height:44px;margin:-22px 0 0 -22px}
#orb.down{width:13px;height:13px;margin:-6.5px 0 0 -6.5px;transition-duration:.12s}
#orb.ctx{width:34px;height:34px;margin:-17px 0 0 -17px;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9),rgba(130,190,255,.45) 40%,rgba(255,255,255,.08) 70%)}
#orb.busy{animation:pulse 1s ease-in-out infinite}
#orb.busy::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2.5px solid transparent;border-top-color:#fff;border-right-color:rgba(255,255,255,.4);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.6}}
.rip{position:fixed;z-index:9998;border-radius:50%;pointer-events:none;border:1.5px solid rgba(255,255,255,.8);background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%);transform:translate(-50%,-50%) scale(.2);animation:rip .7s var(--ease) forwards}
.rip.r{border-color:rgba(140,200,255,.9);animation-duration:.9s;border-width:3px}
@keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
@media(hover:none){#orb{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}

/* ===== mobile ===== */
html,body{overscroll-behavior:none}
body{touch-action:manipulation;-webkit-touch-callout:none}
.grip,.mr,.mprog,.ti{display:none}
#scrim{position:fixed;inset:0;z-index:9980;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
@media(hover:none){
 .fv{opacity:.8;width:40px;height:40px}
 .mr{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;opacity:.8}
 .mr svg{width:20px;height:20px}
 .row:hover{background:none}

 .ib:not(.on):not(.play):hover{background:rgba(255,255,255,.1)}

}
@media(max-width:860px),(pointer:coarse) and (max-height:520px){
 .glass{backdrop-filter:blur(18px) saturate(180%) brightness(.92);-webkit-backdrop-filter:blur(18px) saturate(180%) brightness(.92)}
 .app{display:block;padding:0;height:100%;height:100dvh}

 .lib::before,.lib::after{display:none}
 .hd{padding:0 14px 0 18px}h1{font-size:36px}
 #count{padding:2px 18px 12px}
 .search{margin:0 14px 12px;height:46px;border-radius:16px}.search input{font-size:16px}
 .list{margin-top:0;padding:4px 8px calc(env(safe-area-inset-bottom) + 172px);-webkit-mask-image:none;mask-image:none}
 .row{padding:8px 6px 8px 10px;gap:14px}
 .art{width:56px;height:56px;border-radius:14px}
 .t b{font-size:17px}.t small{font-size:14px}
 .seg{position:fixed;z-index:12;left:50%;right:auto;width:min(300px,calc(100vw - 150px));min-width:216px;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);margin:0;padding:4px;border-radius:30px;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));backdrop-filter:blur(20px) saturate(190%);-webkit-backdrop-filter:blur(20px) saturate(190%);border:0;box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -1px 1px rgba(255,255,255,.1),0 12px 32px rgba(0,0,0,.5),0 0 34px -14px var(--c1);transition:transform .55s var(--ease),opacity .3s}.seg::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.75),transparent 38%,transparent 62%,var(--c1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
 .seg .thumb{top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(255,255,255,.1));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 18px -4px var(--c1)}
 .seg button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;font-size:10.5px;font-weight:600}.seg .ti{display:block}.seg .ti svg{width:21px;height:21px}
 body.pv .seg{transform:translate(-50%,160%);opacity:0;pointer-events:none}
 #mini{bottom:calc(env(safe-area-inset-bottom) + 76px);padding:9px 12px 14px 9px}
 #mini .art{width:48px;height:48px;border-radius:12px}
 .mprog{display:block;position:absolute;left:24px;right:24px;bottom:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;pointer-events:none}
 .mprog::after{content:"";position:absolute;inset:0;width:var(--mp,0%);background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 10px var(--c1)}
 .player{top:0;height:100%;height:100dvh;border-radius:34px 34px 0 0;background:rgba(8,10,22,.8);overflow-y:auto;justify-content:safe center;padding:calc(env(safe-area-inset-top) + 56px) 24px calc(env(safe-area-inset-bottom) + 24px);visibility:hidden;backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);transition:transform .65s var(--ease),visibility 0s linear .65s}
 body.pv .player{visibility:visible;transition:transform .65s var(--ease),visibility 0s}
 .grip{display:block;position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:50%;width:42px;height:5px;margin-left:-21px;border-radius:3px;background:rgba(255,255,255,.35)}

<script>
const $=s=>document.querySelector(s),au=$('#au'),orb=$('#orb'),list=$('#list'),seek=$('#seek'),vol=$('#vol');

};
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function dominantHue(img){try{const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d');x.drawImage(img,0,0,24,24);const d=x.getImageData(0,0,24,24).data;let sx=0,sy=0,w=0;for(let i=0;i<d.length;i+=4){const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),s=mx?(mx-mn)/mx:0;if(s<.25||mx<.25)continue;let h=mx===r?((g-b)/(mx-mn))%6:mx===g?(b-r)/(mx-mn)+2:(r-g)/(mx-mn)+4;h*=60;const t=s*mx;sx+=Math.cos(h*Math.PI/180)*t;sy+=Math.sin(h*Math.PI/180)*t;w+=t}return w>1?(Math.atan2(sy,sx)*180/Math.PI+360)%360:null}catch{return null}}
function loadArt(s,i){const im=new Image();im.alt='';im.decoding='async';

  $('#mArt').style.background=`url("${artUrl(s,240)}") center/cover`;$('#mArt').innerHTML='';
  const h=dominantHue(im);if(h!=null)setHue(h);setMeta(s,new URL(artUrl(s,512),location.href).href);syncMini()};

const hap=(n=8)=>{try{navigator.vibrate&&navigator.vibrate(n)}catch{}};

let mini=null,curHue=265,songs=[],cur=-1,order=[],pos=0,uq=[],tab='all',failed=false,sleepT=0,sleepI=0,ctxIdx=-1;
let shuffle=store.get('sh',false),rep=store.get('rep',0),speed=store.get('spd',1),favs=new Set(store.get('fav',[]));
const SPD=[.75,1,1.25,1.5,2],SLP=[0,15,30,60];

/* static icons */
$('#sIc').innerHTML=I.search;$('#pop').innerHTML=I.pop;$('#install').innerHTML=I.dl;$('#lite').innerHTML=I.bolt;document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=I[e.dataset.ic]);$('#refresh').innerHTML=I.refresh;$('#back').innerHTML=I.chev;$('#big').innerHTML=I.note;
$('#prev').innerHTML=I.prev;$('#next').innerHTML=$('#mNext').innerHTML=I.next;$('#b10').innerHTML=I.b10;$('#f10').innerHTML=I.f10;$('#shuf').innerHTML=I.shuf;
function icons(){
 $('#play').innerHTML=$('#mPlay').innerHTML=au.paused?I.play:I.pause;
 $('#shuf').classList.toggle('on',shuffle);
 $('#rep').innerHTML=rep===2?I.rep1:I.rep;$('#rep').classList.toggle('on',rep>0);
 const f=cur>=0&&favs.has(songs[cur].id);$('#fav').innerHTML=heart(f);$('#fav').classList.toggle('on',f);
 $('#spd').textContent=speed+'×';$('#spd').classList.toggle('on',speed!==1);
 $('#slp').innerHTML=SLP[sleepI]?SLP[sleepI]+'m':I.moon;$('#slp').classList.toggle('on',sleepI>0);

}
function setVol(v){v=Math.min(1,Math.max(0,v));au.volume=v;vol.value=v*100;vol.style.setProperty('--p',v*100+'%');store.set('vol',v);icons()}

/* data */
const SK='<div class="skl"></div>'.repeat(7);
async function load(first){
 busy(true);$('#count').textContent='Loading…';if(first)list.innerHTML=SK;
 try{
  const r=await fetch('/api/songs');if(!r.ok)throw 0;const d=await r.json();
  const id=songs[cur]?.id;songs=d.map(s=>({...s,...parse(s.name)}));cur=songs.findIndex(s=>s.id===id);

function render(anim){
 const q=$('#q').value.trim().toLowerCase();let idx;

const markActive=()=>list.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',+r.dataset.i===cur));

au.onplay=au.onpause=()=>{document.body.classList.toggle('paused',au.paused);if(!au.paused)startTick();icons();if('mediaSession'in navigator)navigator.mediaSession.playbackState=au.paused?'paused':'playing'};

/* controls */

 document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
 $('#seg').style.setProperty('--i',['all','fav','queue'].indexOf(tab));render(true)};
list.onclick=e=>{const f=e.target.closest('.fv');if(f)return toggleFav(+f.dataset.f);const mr=e.target.closest('.mr');if(mr){ctxIdx=+mr.dataset.m;const b=mr.getBoundingClientRect();return showMenu(b.left,b.bottom,true)}
 const r=e.target.closest('.row');if(r){const i=+r.dataset.i;uq=uq.filter(x=>x!==i);play(i)}};
addEventListener('click',e=>{const b=e.target.closest('button');if(b)b.blur()});

/* keyboard */
addEventListener('keydown',e=>{
 if(e.target.matches('input[type=search]')){if(e.key==='Escape')e.target.blur();return}
 const k=e.key.toLowerCase(),m={' ':tog,arrowright:()=>skip(10),arrowleft:()=>skip(-10),arrowup:()=>{au.muted=false;setVol(au.volume+.05)},arrowdown:()=>setVol(au.volume-.05),n:()=>next(),p:prev,m:mute,s:toggleShuffle,r:cycleRep,f:()=>toggleFav(cur),o:openMini,l:toggleLite,'/':()=>$('#q').focus()};
 if(m[k]&&!e.metaKey&&!e.ctrlKey){e.preventDefault();m[k]()}});
if('mediaSession'in navigator){const M=navigator.mediaSession;[['play',()=>au.play()],['pause',()=>au.pause()],['nexttrack',()=>next()],['previoustrack',prev],['seekbackward',()=>skip(-10)],['seekforward',()=>skip(10)]].forEach(([a,f])=>{try{M.setActionHandler(a,f)}catch{}})}

/* context menu */
const MQ='(max-width:860px),(pointer:coarse) and (max-height:520px)',mobile=()=>matchMedia(MQ).matches;
function showMenu(x,y,hasRow){const m=$('#menu');rects.clear();
 m.querySelectorAll('[data-a=play],[data-a=pnext],[data-a=queue],[data-a=fav]').forEach(b=>b.style.display=hasRow?'block':'none');
 m.style.display='block';m.style.left=Math.min(x,innerWidth-220)+'px';m.style.top=Math.min(y,innerHeight-230)+'px';
 m.style.animation='none';m.offsetHeight;m.style.animation='';if(mobile())$('#scrim').classList.add('on')}
function hideMenu(){$('#menu').style.display='none';$('#scrim').classList.remove('on')}
addEventListener('contextmenu',e=>{e.preventDefault();orb.classList.add('ctx');setTimeout(()=>orb.classList.remove('ctx'),500);ripple(e.clientX,e.clientY,1);
 const r=e.target.closest('.row');ctxIdx=r?+r.dataset.i:-1;showMenu(e.clientX,e.clientY,!!r)});
addEventListener('click',hideMenu,true);
$('#menu').onclick=e=>{const a=e.target.dataset.a,i=ctxIdx;
 if(a==='play')play(i);if(a==='pnext'){uq.unshift(i);toast('Playing next');if(tab==='queue')render()}
 if(a==='queue'){uq.push(i);toast('Added to queue');if(tab==='queue')render()}
 if(a==='fav')toggleFav(i);if(a==='refresh')load()};

/* glass light + cursor */
let mx=innerWidth/2,my=innerHeight/2,x=mx,y=my,raf=0,pend=null,lastG=null;const rects=new Map();
const kick=()=>{if(!raf)raf=requestAnimationFrame(frame)};
function frame(){raf=0;
 const dx=mx-x,dy=my-y;x+=dx*.28;y+=dy*.28;const v=Math.min(Math.hypot(dx,dy)/40,.5),a=Math.atan2(dy,dx)*180/Math.PI;
 orb.style.transform=`translate3d(${x}px,${y}px,0) rotate(${a}deg) scale(${1+v},${1-v*.5})`;
 if(pend){const e=pend;pend=null;lightUp(e)}
 if(Math.abs(dx)>.15||Math.abs(dy)>.15)kick()}
function lightUp(e){
 orb.classList.toggle('hov',!!e.target.closest('.row,.ib,button,input,.seg,.fv'));
 const g=e.target.closest('.glass');if(lastG&&lastG!==g)lastG.classList.remove('lit');lastG=g;
 if(!g||lite)return;const s=g._s||(g._s=g.querySelector(':scope>.spot'));if(!s)return;
 const now=performance.now();let c=rects.get(g);if(!c||now-c.t>1500){c={r:g.getBoundingClientRect(),t:now};rects.set(g,c)}
 const r=c.r;g.classList.add('lit');s.style.transform=`translate3d(${e.clientX-r.left}px,${e.clientY-r.top}px,0)`;
 const ang=Math.round((Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)*180/Math.PI+90)/10)*10;
 if(ang!==g._a){g._a=ang;g.style.setProperty('--ang',ang+'deg')}}
addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;mx=e.clientX;my=e.clientY;pend=e;kick()},{passive:true});
addEventListener('resize',()=>rects.clear());
function ripple(cx,cy,r){const d=document.createElement('div');d.className='rip'+(r?' r':'');const s=r?120:90;d.style.cssText=`left:${cx}px;top:${cy}px;width:${s}px;height:${s}px`;document.body.append(d);setTimeout(()=>d.remove(),950)}
addEventListener('pointerdown',e=>{if(e.button===0){orb.classList.add('down');ripple(e.clientX,e.clientY)}});
addEventListener('pointerup',()=>orb.classList.remove('down'));
document.addEventListener('mouseleave',()=>orb.style.opacity=0);document.addEventListener('mouseenter',()=>orb.style.opacity=1);

/* floating mini player (Document Picture-in-Picture, popup fallback) */
const MINI_CSS=`:root{--c1:#a64dff;--c2:#00e5ff}*{box-sizing:border-box;margin:0}
body{height:100vh;overflow:hidden;background:#03040a;color:#fff;font-family:Inter,-apple-system,"Segoe UI",sans-serif;position:relative;user-select:none;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:14px 16px 12px}
.bgart{position:absolute;inset:-30px;filter:blur(34px) saturate(1.6);opacity:.5;transform:scale(1.2)}
.shade{position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(0,0,0,.4));box-shadow:inset 0 0 0 1.5px var(--c1),inset 0 0 26px -6px var(--c1)}
.top,.sr{position:relative;z-index:1}.top{display:flex;gap:14px;align-items:center}
.cov{flex:none;width:94px;height:94px;border-radius:18px;background:#2a2d3a;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 30px rgba(0,0,0,.5),0 0 22px -4px var(--c1)}
.info{min-width:0;flex:1}.info b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info small{display:block;opacity:.65;font-size:13px;margin:2px 0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;gap:7px;align-items:center}
button{border:0;color:#fff;background:rgba(255,255,255,.12);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .2s}
button:hover{transform:scale(1.1);background:rgba(255,255,255,.22)}button:active{transform:scale(.88)}
button svg{width:19px;height:19px;fill:currentColor}.pl{width:46px;height:46px;background:#fff;color:#111;box-shadow:0 0 22px var(--c1)}.pl svg{width:22px;height:22px}.on{color:#ff5a7a}
.sr{display:flex;align-items:center;gap:9px;font-size:11px;font-variant-numeric:tabular-nums}.sr span{opacity:.65;min-width:34px}.sr span:last-child{text-align:right}
.rng{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:4px;outline:0;background:linear-gradient(90deg,var(--c1),var(--c2) var(--p,0%),rgba(255,255,255,.18) var(--p,0%))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--c1)}`;
function setHue(h){curHue=h;document.documentElement.style.setProperty('--h',h);syncMini()}
function syncMini(){
 if(!mini)return;const q=mini.q,s=songs[cur],r=mini.win.document.documentElement;
 r.style.setProperty('--c1',`hsl(${curHue} 100% 62%)`);r.style.setProperty('--c2',`hsl(${(curHue+130)%360} 100% 62%)`);
 q('#p-play').innerHTML=au.paused?I.play:I.pause;if(!s)return;
 const bg=s.art?`url("${artUrl(s,480)}") center/cover`:grad(s.name);
 q('#p-t').textContent=s.title;q('#p-a').textContent=s.artist;q('#p-art').style.background=bg;q('#p-bg').style.background=bg;
 const f=favs.has(s.id);q('#p-fav').innerHTML=heart(f);q('#p-fav').classList.toggle('on',f);
}
async function openMini(){
 if(mini){try{mini.win.focus()}catch{}return}
 let w=null;
 try{w='documentPictureInPicture'in window?await documentPictureInPicture.requestWindow({width:400,height:190}):open('','glassmini','popup,width=420,height=240')}catch{}
 if(!w){toast('Pop-out was blocked by the browser');return}
 const d=w.document;d.title='Glass Music';
 d.head.innerHTML=`<meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap"><style>${MINI_CSS}</style>`;
 d.body.innerHTML=`<div class="bgart" id="p-bg"></div><div class="shade"></div><div class="top"><div class="cov" id="p-art"></div><div class="info"><b id="p-t">Nothing playing</b><small id="p-a">Pick a song in Glass Music</small><div class="ctl"><button id="p-prev"></button><button id="p-play" class="pl"></button><button id="p-next"></button><button id="p-fav"></button></div></div></div><div class="sr"><span id="p-c">0:00</span><input id="p-seek" class="rng" type="range" min="0" max="1000" value="0"><span id="p-d">-0:00</span></div>`;
 const q=x=>d.querySelector(x),m={win:w,q,drag:false};mini=m;
 q('#p-prev').innerHTML=I.prev;q('#p-next').innerHTML=I.next;
 q('#p-prev').onclick=prev;q('#p-next').onclick=()=>next();q('#p-play').onclick=tog;q('#p-fav').onclick=()=>toggleFav(cur);
 const k=q('#p-seek');k.oninput=()=>{m.drag=true;if(au.duration){k.style.setProperty('--p',k.value/10+'%');q('#p-c').textContent=fmt(k.value/1000*au.duration)}};
 k.onchange=()=>{if(au.duration)au.currentTime=k.value/1000*au.duration;m.drag=false};
 d.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();tog()}if(e.key==='ArrowRight')skip(10);if(e.key==='ArrowLeft')skip(-10)});
 w.addEventListener('pagehide',()=>{if(mini===m)mini=null;$('#pop').classList.remove('on')});
 $('#pop').classList.add('on');syncMini();if(au.duration)setProg(au.currentTime/au.duration);
}

/* performance mode: pointer light as compositor-only layers, auto-detects slow devices */
document.querySelectorAll('.glass:not(#toast)').forEach(g=>{const s=document.createElement('i');s.className='spot';g.prepend(s)});
let lite=false;
function setLite(v){lite=v;document.documentElement.classList.toggle('lite',v);$('#lite').classList.toggle('on',v)}
function toggleLite(){setLite(!lite);store.set('lite',lite);toast(lite?'Performance mode on':'Full effects on')}
$('#lite').onclick=toggleLite;
document.addEventListener('visibilitychange',()=>document.documentElement.classList.toggle('bgpause',document.hidden));
const manual=store.get('lite',null);
if(manual!==null)setLite(manual);
else setTimeout(()=>{let n=0,t0=0;requestAnimationFrame(function p(t){if(!t0)t0=t;n++;if(t-t0<2000){requestAnimationFrame(p);return}if(document.hidden)return;if(n/((t-t0)/1000)<40){setLite(true);toast('Smooth mode enabled for this device')}})},2500);

/* touch gestures */
function swipe(el,h){let sx=0,sy=0;el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
 el.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy,ax=Math.abs(dx),ay=Math.abs(dy);
  if(ax>ay*1.5&&ax>55)(dx<0?h.left:h.right)?.();else if(ay>ax*1.5&&ay>60)(dy<0?h.up:h.down)?.()},{passive:true})}
swipe($('.wrap'),{left:()=>{hap();next()},right:()=>{hap();prev()}});
swipe($('#mini'),{left:()=>{hap();next()},right:()=>{hap();prev()},up:()=>document.body.classList.add('pv')});
(function(){const p=$('.player');let y0=0,x0=0,dy=0,on=false,lock=0;
 p.addEventListener('touchstart',e=>{if(!mobile()||p.scrollTop>0||e.target.closest('input'))return;const t=e.touches[0];y0=t.clientY;x0=t.clientX;dy=0;on=true;lock=0},{passive:true});
 p.addEventListener('touchmove',e=>{if(!on)return;const t=e.touches[0];dy=t.clientY-y0;if(!lock)lock=Math.abs(dy)>Math.abs(t.clientX-x0)?1:2;if(lock===1&&dy>0){p.style.transition='none';p.style.transform=`translateY(${dy}px)`}},{passive:true});
 p.addEventListener('touchend',()=>{if(!on)return;on=false;p.style.transition='';p.style.transform='';if(lock===1&&dy>120)document.body.classList.remove('pv')},{passive:true})})();
if(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone&&!store.get('iosTip',false))setTimeout(()=>{toast('Tip: tap Share, then Add to Home Screen, for a full-screen app');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('on'),6000);store.set('iosTip',true)},5000);

setVol(store.get('vol',.8));au.defaultPlaybackRate=speed;au.onpause();load(true);
</script></body></html>
